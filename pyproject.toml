[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyprwave"
version = "0.1.0"
description = "Touchless hand-gesture controller with a live HUD overlay for Hyprland on Linux."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.20",
    "numpy>=1.26,<3",
    "PyQt6>=6.7",
]

[project.scripts]
hyprwave = "hyprwave.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprwave"]
